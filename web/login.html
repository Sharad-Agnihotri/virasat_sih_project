<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — VIRASAT Heritage Platform</title>

  <!-- Google Fonts: Cormorant Garamond, Outfit, Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400;1,600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="assets/js/subscription.js"></script>

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #06070b;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* ── RICH CULTURAL HERITAGE BACKGROUND ── */
    .bg-heritage-layer {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(135deg, rgba(6, 7, 11, 0.88) 0%, rgba(13, 16, 26, 0.94) 100%),
        url('assets/images/taj_mahal_panorama.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      z-index: 1;
    }

    /* Rotating Cultural Mandala Glow */
    .mandala-bg {
      position: fixed;
      top: 50%;
      left: 25%;
      width: 750px;
      height: 750px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, rgba(217, 119, 6, 0.03) 50%, rgba(6, 7, 11, 0) 70%);
      z-index: 2;
      pointer-events: none;
      animation: spinMandala 120s linear infinite;
    }

    @keyframes spinMandala {
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Header Nav */
    .header-bar {
      position: absolute;
      top: 28px;
      left: 48px;
      right: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #0f1420;
      border: 1px solid rgba(245, 158, 11, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .brand-circle img {
      height: 22px;
      width: auto;
      mix-blend-mode: screen;
      filter: brightness(1.3);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(12px);
      transition: all 0.25s ease;
    }
    .back-btn:hover {
      background: rgba(245, 158, 11, 0.2);
      border-color: #f59e0b;
      color: #fff;
    }

    /* ── SPLIT SCREEN LAYOUT ── */
    .split-wrapper {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 880px;
      width: 100%;
      margin: 80px auto 40px auto;
      padding: 0 24px;
      gap: 28px;
    }

    /* ── LEFT SIDE: BIG HERITAGE GUARDIAN MASCOT ── */
    .mascot-hero-panel {
      width: 360px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 10px;
    }

    .guardian-container {
      position: relative;
      margin-bottom: 24px;
    }

    .guardian-svg-large {
      width: 180px;
      height: 180px;
      filter: drop-shadow(0 15px 35px rgba(245, 158, 11, 0.25));
    }

    /* Eyes Roll Upward in Privacy Mode */
    .pupil {
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .guardian-svg-large.privacy-active .pupil-left,
    .guardian-svg-large.privacy-active .pupil-right {
      transform: translateY(-11px) translateX(1px);
    }

    .guardian-svg-large.privacy-active .eyebrows {
      transform: translateY(-5px);
    }

    .eyebrows {
      transition: transform 0.4s ease;
    }

    .privacy-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #fbbf24;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 16px;
      opacity: 0;
      transform: translateY(-6px);
      transition: all 0.3s ease;
    }

    .guardian-svg-large.privacy-active + .privacy-status-pill {
      opacity: 1;
      transform: translateY(0);
    }

    .mascot-headline {
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px;
      font-weight: 600;
      line-height: 1.15;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .mascot-subtext {
      font-size: 15px;
      color: #94a3b8;
      max-width: 420px;
      line-height: 1.6;
    }

    /* ── RIGHT SIDE: GLASSMORPHISM LOGIN CONTAINER ── */
    .auth-glass-card {
      width: 100%;
      max-width: 440px;
      background: rgba(18, 22, 34, 0.55);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 32px;
      padding: 44px 36px;
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.75), 0 0 40px rgba(245, 158, 11, 0.15);
    }

    /* Role Tabs: Tourist vs Artisan */
    .role-tabs {
      display: flex;
      background: rgba(10, 12, 20, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .role-tab {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .role-tab.active {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0f172a;
      font-weight: 700;
      box-shadow: 0 4px 18px rgba(245, 158, 11, 0.35);
    }

    /* Titles */
    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .card-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    /* Inputs */
    .field-group {
      margin-bottom: 20px;
    }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .glass-input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(9, 11, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.25s ease;
    }

    .glass-input:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
      background: rgba(14, 18, 28, 0.9);
    }

    /* Submit Button */
    .glass-submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.4);
      transition: all 0.25s ease;
      margin-top: 8px;
    }

    .glass-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(245, 158, 11, 0.55);
      filter: brightness(1.05);
    }

    /* Mode Switcher Footer */
    .form-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #94a3b8;
    }

    .form-footer-link {
      color: #fbbf24;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      margin-left: 4px;
    }
    .form-footer-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      .split-wrapper {
        flex-direction: column;
        margin-top: 100px;
        gap: 40px;
        padding: 0 20px;
      }
      .mascot-hero-panel {
        display: none;
      }
    }
  </style>
  <link rel="stylesheet" href="assets/css/mobile.css">
</head>

<body>

  <!-- Rich Heritage Background -->
  <div class="bg-heritage-layer"></div>
  <div class="mandala-bg"></div>

  <!-- Header Nav -->
  <header class="header-bar">
    <div class="brand-link">
      <div class="brand-circle">
        <img loading="lazy" decoding="async" src="assets/images/logo.jpg" alt="Virasat Logo">
      </div>
      <span class="brand-title">Virasat</span>
    </div>
  </header>

  <!-- Split Screen Layout -->
  <main class="split-wrapper">

    <!-- ── LEFT SIDE: BIG HERITAGE GUARDIAN MASCOT ── -->
    <div class="mascot-hero-panel">
      <div class="guardian-container">
        <!-- Heritage Guardian SVG (Palace Temple Dome & Royal Peacock Motif) -->
        <svg class="guardian-svg-large" id="guardianSvg" viewBox="0 0 120 120">
          <!-- Outer Aura Glow Circle -->
          <circle cx="60" cy="60" r="54" fill="rgba(245, 158, 11, 0.05)" stroke="rgba(245, 158, 11, 0.2)" stroke-dasharray="4 4" />
          
          <!-- Chhatri Dome Roof Motif -->
          <path d="M60 10 Q35 30 60 38 Q85 30 60 10 Z" fill="#d97706" />
          <line x1="60" y1="2" x2="60" y2="10" stroke="#fbbf24" stroke-width="2.5" />
          <circle cx="60" cy="2" r="3" fill="#fbbf24" />

          <!-- Guardian Head Base -->
          <circle cx="60" cy="68" r="38" fill="#131722" stroke="rgba(245, 158, 11, 0.5)" stroke-width="2" />
          
          <!-- Eyebrows -->
          <g class="eyebrows" id="eyebrowsGroup">
            <path d="M40 52 Q49 46 56 52" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round" />
            <path d="M64 52 Q71 46 80 52" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round" />
          </g>

          <!-- Eye Whites -->
          <ellipse cx="48" cy="62" rx="10" ry="8" fill="#ffffff" />
          <ellipse cx="72" cy="62" rx="10" ry="8" fill="#ffffff" />

          <!-- Pupils (Roll Upward on Password Focus) -->
          <g class="pupil-group">
            <circle class="pupil pupil-left" id="pupilLeft" cx="48" cy="62" r="4.5" fill="#06070b" />
            <circle class="pupil pupil-right" id="pupilRight" cx="72" cy="62" r="4.5" fill="#06070b" />
          </g>

          <!-- Sacred Royal Tilak -->
          <path d="M60 42 L63 50 L57 50 Z" fill="#f59e0b" />
          <circle cx="60" cy="53" r="2" fill="#e11d48" />

          <!-- Royal Mustache / Masons Symbol -->
          <path d="M48 78 Q60 84 72 78 Q60 88 48 78 Z" fill="#fbbf24" opacity="0.8" />
        </svg>

        <div class="privacy-status-pill">🙈 Your Privacy is Respected Here</div>
      </div>

      <h1 class="mascot-headline">Where Traditions<br><span style="color:#fbbf24; font-style:italic;">Live Forever</span></h1>
      <p class="mascot-subtext">
        Discover India's timeless heritage — sacred temples, grand palaces, and living traditions preserved across generations.
      </p>
    </div>

    <!-- ── RIGHT SIDE: GLASSMORPHISM LOGIN CONTAINER ── -->
    <div class="auth-glass-card">

      <!-- Role Selector Tabs -->
      <div class="role-tabs">
        <button class="role-tab active" id="roleTouristBtn" onclick="selectRole('tourist')">
          🧳 Tourist
        </button>
        <button class="role-tab" id="roleArtisanBtn" onclick="selectRole('artisan')">
          🎨 Artisan Seller
        </button>
      </div>

      <!-- Title Header -->
      <h2 class="card-title" id="cardTitle">Sign In</h2>
      <p class="card-subtitle" id="cardSubtitle">Access your heritage account and saved itineraries</p>

      <!-- Form -->
      <form id="authForm" onsubmit="handleFormSubmit(event)">
        <!-- Name (Register Only) -->
        <div class="field-group" id="nameGroup" style="display: none;">
          <label class="field-label" for="inputName">Full Name</label>
          <input type="text" class="glass-input" id="inputName" placeholder="Sayed Ali">
        </div>

        <!-- Email -->
        <div class="field-group">
          <label class="field-label" for="inputEmail">Email Address</label>
          <input type="email" class="glass-input" id="inputEmail" placeholder="name@example.com" required>
        </div>

        <!-- Password (Triggers Eye Roll Upward) -->
        <div class="field-group">
          <label class="field-label" for="inputPassword">Password</label>
          <input type="password" class="glass-input" id="inputPassword" placeholder="••••••••" required>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="glass-submit-btn" id="submitBtn">
          Sign In →
        </button>
      </form>

      <!-- Toggle Form Mode -->
      <div class="form-footer">
        <span id="footerQuestion">Don't have an account?</span>
        <span class="form-footer-link" id="footerLink" onclick="toggleFormMode()">Create one</span>
      </div>

    </div>

  </main>

  <script>
    let activeRole = 'tourist';
    let isRegisterMode = false;

    const guardianSvg = document.getElementById('guardianSvg');
    const pupilLeft = document.getElementById('pupilLeft');
    const pupilRight = document.getElementById('pupilRight');
    const inputPassword = document.getElementById('inputPassword');

    /* ── Eye Cursor Tracking ── */
    document.addEventListener('mousemove', (e) => {
      if (guardianSvg.classList.contains('privacy-active')) return;
      const rect = guardianSvg.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const angle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
      const moveX = Math.cos(angle) * 3;
      const moveY = Math.sin(angle) * 3;

      pupilLeft.style.transform = `translate(${moveX}px, ${moveY}px)`;
      pupilRight.style.transform = `translate(${moveX}px, ${moveY}px)`;
    });

    /* ── EYES ROLL UPWARD ON PASSWORD FOCUS (Privacy Protection) ── */
    inputPassword.addEventListener('focus', () => {
      guardianSvg.classList.add('privacy-active');
      pupilLeft.style.transform = 'translateY(-11px)';
      pupilRight.style.transform = 'translateY(-11px)';
    });

    inputPassword.addEventListener('blur', () => {
      guardianSvg.classList.remove('privacy-active');
      pupilLeft.style.transform = 'translate(0,0)';
      pupilRight.style.transform = 'translate(0,0)';
    });

    /* ── Role Switcher (Tourist vs Artisan) ── */
    function selectRole(role) {
      activeRole = role;
      document.getElementById('roleTouristBtn').classList.toggle('active', role === 'tourist');
      document.getElementById('roleArtisanBtn').classList.toggle('active', role === 'artisan');

      const sub = document.getElementById('cardSubtitle');
      if (role === 'artisan') {
        sub.textContent = isRegisterMode ? 'Register to list authentic GI-tagged crafts' : 'Sign in to Artisan Seller Portal';
      } else {
        sub.textContent = isRegisterMode ? 'Create account to explore Indian heritage' : 'Access your heritage account and saved itineraries';
      }
    }

    /* ── Form Mode Switcher (Login vs Register) ── */
    function toggleFormMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('nameGroup').style.display = isRegisterMode ? 'block' : 'none';
      document.getElementById('cardTitle').textContent = isRegisterMode ? 'Create Account' : 'Sign In';
      document.getElementById('submitBtn').textContent = isRegisterMode ? 'Create Account →' : 'Sign In →';
      document.getElementById('footerQuestion').textContent = isRegisterMode ? 'Already have an account?' : "Don't have an account?";
      document.getElementById('footerLink').textContent = isRegisterMode ? 'Sign in' : 'Create one';

      selectRole(activeRole);
    }

    /* ── Form Handler ── */
    function handleFormSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('inputEmail').value.trim().toLowerCase();
      const typedName = (document.getElementById('inputName')?.value || '').trim();

      /* Per-account records, keyed by email, so a name entered at registration
         is still there the next time that person signs in — and so two people
         signing in on one device get their own profile rather than each
         other's. */
      let users = {};
      try { users = JSON.parse(localStorage.getItem('virasat_users') || '{}'); } catch (err) { users = {}; }
      const existing = users[email] || {};
      const name = typedName || existing.name || email.split('@')[0]
        .replace(/[._-]+/g, ' ')
        .replace(/\b\w/g, ch => ch.toUpperCase());
      users[email] = {
        name,
        role: activeRole,
        joined: existing.joined || new Date().toISOString()
      };
      try { localStorage.setItem('virasat_users', JSON.stringify(users)); } catch (err) { /* private mode */ }

      localStorage.setItem('virasat_user_logged_in', 'true');
      localStorage.setItem('virasat_user_role', activeRole);
      localStorage.setItem('virasat_user_email', email);
      localStorage.setItem('virasat_user_name', name);

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Authenticating...';

      setTimeout(() => {
        // A page that bounced us here (e.g. profile.html) can ask to be
        // returned to. Only same-folder .html targets are honoured.
        const next = new URLSearchParams(window.location.search).get('next') || '';
        if (activeRole === 'tourist' && /^[a-z0-9_-]+\.html$/i.test(next)) {
          window.location.href = next;
        } else if (activeRole === 'tourist') {
          window.location.href = 'index.html';
        } else {
          window.location.href = 'artisan.html';
        }
      }, 700);
    }
  </script>
<script src="assets/js/guide.js" defer></script>
</body>

</html>
